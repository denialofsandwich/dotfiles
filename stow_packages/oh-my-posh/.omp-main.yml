$schema: >-
  https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        background: "235"
        foreground: "12"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: "{{ if .WSL }}WSL at {{ end }}{{ .Icon }} "
      - type: root
        background: "235"
        foreground: "13"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: "  "
      - type: session
        background: "235"
        foreground: "14"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: '{{ if eq .Env.OMP_SHOW_SESSION "1" }}{{ if .Root }}<b>{{ end }} {{ .UserName }}{{ if .Root }}</b>{{ end }}@{{ .HostName }} {{ end }}'
      - type: shell
        background: "235"
        foreground: "13"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: '{{ if ne .Name "zsh" }} {{ .Name }} {{ end }}'
        options:
          mapped_shell_names:
            pwsh: ps
      - type: git
        background: "235"
        foreground: "11"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: >-
          <> {{ .UpstreamIcon }}  {{ .HEAD }}{{
          if or .Ahead .Behind }} {{ end }}{{
          if .Ahead }}↑{{ .Ahead }}{{ end }}{{
          if .Behind }}↓{{ .Behind }}{{ end }}{{
          if .Staging.Changed }}<2>  {{ .Staging.String }}</>{{ end }}{{
          if .Working.Changed }}<16>  {{ .Working.String }}</>{{ end }}{{
          if gt .StashCount 0 }}<4>  {{ .StashCount }}</>{{ end }} <>
      - type: python
        background: "235"
        foreground: "10"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: "  {{ .Venv }} "
      - type: text
        background: "235"
        foreground: "14"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: " {{ if .Env.DEVC_SESSION_NAME }} {{ .Env.DEVC_SESSION_NAME }}{{ end }} "
      - type: text
        background: "235"
        foreground: "17"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: " {{ if .Env.OMP_CUSTOM1 }}{{ .Env.OMP_CUSTOM1 }}{{ end }} "
      - type: text
        background: "235"
        foreground: "15"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        template: " {{ if .Env.OMP_CUSTOM2 }}{{ .Env.OMP_CUSTOM2 }}{{ end }} "
  - type: prompt
    alignment: right
    segments:
      - type: status
        background: "235"
        foreground: "13"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        options:
          status_template: "{{ reason .Code }}"
      - type: executiontime
        background: "235"
        foreground: "3"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        options:
          threshold: 500
          style: round
        template: " {{ .FormattedMs }}  "
      - type: time
        background: "235"
        foreground: "4"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        options:
          time_format: "15:04:05"
        template: " {{ .CurrentDate | date .Format }}  "
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: path
        background: "235"
        foreground: "12"
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        options:
          home_icon: "<4><b>~</b></>"
          right_format: "<4><b>%s</b></>"
          style: full
        template: " {{ .Path }} "
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: status
        foreground: "10"
        foreground_templates:
          - "{{ if gt .Code 0 }}9{{ end }}"
        style: plain
        options:
          always_enabled: true
        template: "❯ "
version: 3
