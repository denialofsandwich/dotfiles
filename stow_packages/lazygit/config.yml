gui:
  nerdFontsVersion: "3"
  # tokyonight moon, as generated by snacks.nvim (it overrides this when lazygit runs inside nvim)
  theme:
    activeBorderColor:
      - "#ff966c"
      - "bold"
    inactiveBorderColor:
      - "#589ed7"
    searchingActiveBorderColor:
      - "#ff966c"
      - "bold"
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"
git:
  diffRenderers:
    - command: delta --paging=never
keybinding:
  universal:
    nextTab: "ä"
    prevTab: "ö"
customCommands:
  - key: "D"
    context: "localBranches"
    command: 'nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:DiffviewOpen {{.SelectedLocalBranch.Name}}..HEAD<CR>"'
    description: "Diffview: Branch vs HEAD"
  - key: "D"
    context: "commits"
    command: 'nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:DiffviewOpen {{.SelectedCommit.Hash}}..HEAD<CR>"'
    description: "Diffview: Commit vs HEAD"
