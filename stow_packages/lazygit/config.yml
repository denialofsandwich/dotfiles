gui:
  nerdFontsVersion: "3"
  colorScheme: auto
  # tokyonight moon
  darkTheme:
    activeBorderColor:
      - "#ff966c"
      - "bold"
    inactiveBorderColor:
      - "#589ed7"
    searchingActiveBorderColor:
      - "#ff966c"
      - "bold"
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    markedBaseCommitFgColor:
      - "#82aaff"
    markedBaseCommitBgColor:
      - "#ffc777"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"
  # tokyonight day
  lightTheme:
    activeBorderColor:
      - "#b15c00"
      - "bold"
    inactiveBorderColor:
      - "#4094a3"
    searchingActiveBorderColor:
      - "#b15c00"
      - "bold"
    optionsTextColor:
      - "#2e7de9"
    selectedLineBgColor:
      - "#b7c1e3"
    cherryPickedCommitFgColor:
      - "#2e7de9"
    cherryPickedCommitBgColor:
      - "#9854f1"
    markedBaseCommitFgColor:
      - "#2e7de9"
    markedBaseCommitBgColor:
      - "#8c6c3e"
    unstagedChangesColor:
      - "#c64343"
    defaultFgColor:
      - "#3760bf"
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never
keybinding:
  universal:
    nextTab: "ä"
    prevTab: "ö"
customCommands:
  - key: "D"
    context: "localBranches"
    command: 'nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:DiffviewOpen {{.SelectedLocalBranch.Name}}..HEAD<CR>"'
    description: "Diffview: Branch vs HEAD"
  - key: "D"
    context: "commits"
    command: 'nvim --server "$NVIM" --remote-send "<C-\><C-n>:close<CR>:DiffviewOpen {{.SelectedCommit.Hash}}..HEAD<CR>"'
    description: "Diffview: Commit vs HEAD"
