[mgr]
linemode = "permissions"

[opener]
edit = [
  { run = '$SHELL', block = true, desc = "shell" },
  { run = 'nvim %s', block = true, desc = "neovim" },
]
open = [
  { run = 'xdg-open %s', orphan = true, desc = "open", for = "linux" },
  { run = 'open %s', orphan = true, desc = "open", for = "macos" },
  { run = '''dbus-send --session --print-reply --dest=org.freedesktop.FileManager1 /org/freedesktop/FileManager1 org.freedesktop.FileManager1.ShowItems array:string:"file://$(realpath %s1)" string:""''', desc = "reveal", for = "linux" },
  { run = 'open -R %s1', orphan = true, desc = "reveal", for = "macos" },
]

[open]
rules = [
  { url = "*/", use = [
    "open",
    "edit",
  ] },
  { mime = "*", use = [
    "open",
    "edit",
  ] },
]

[plugin]
prepend_spotters = [
  { mime = "video/*", run = "spot-video" },
  { mime = "audio/*", run = "spot-audio" },
  { mime = "image/*", run = "spot-image" },
  { url = "*/", run = "spot" },
  { url = "*", run = "spot" },
]
