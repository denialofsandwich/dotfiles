env KITTY_SSH=1
# Workaround to allow loading own bashrc
# see ssh-bash/profile
env KITTY_BASH_SYS_PROFILE=$HOME/.kitty_dotfiles/profile
copy --symlink-strategy resolve --dest .kitty_dotfiles/profile .config/kitty/ssh-bash/profile
copy --symlink-strategy resolve --dest .kitty_dotfiles/.bash_profile .config/kitty/ssh-bash/bash_profile
copy --symlink-strategy resolve --dest .kitty_dotfiles/.bashrc .bashrc
copy --symlink-strategy resolve --dest .kitty_dotfiles/.omp-main.yml .omp-main.yml
